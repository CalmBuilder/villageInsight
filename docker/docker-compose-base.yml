services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    env_file: .env
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=8GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - wal_buffers=16MB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
    ports:
      - "${EXPOSE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - village-insight
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
    name: village_insight_postgres_data

networks:
  village-insight:
    name: village_insight
