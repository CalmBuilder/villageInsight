include:
  - ./docker/docker-compose-base.yml

x-application-database-environment: &application-database-environment
  DATABASE_URL: ${POSTGRES_APPLICATION_URL:-postgresql+psycopg://village_insight:village_insight@postgres:5432/village_insight}

services:
  secret-init:
    profiles: ["application"]
    build:
      context: .
    user: "0:0"
    env_file: .env
    environment:
      <<: *application-database-environment
      SECRET_KEY_PATH: /data/secrets/settings.key
      VI_HOST_UID: ${VI_HOST_UID:-1000}
      VI_HOST_GID: ${VI_HOST_GID:-1000}
    command: >
      sh -c 'village-insight-secret-preflight
      --owner-uid "$${VI_HOST_UID}" --group-gid "$${VI_HOST_GID}"'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - village-insight
    volumes:
      - ./data/secrets:/data/secrets
    restart: "no"

  api:
    profiles: ["application"]
    build:
      context: .
    env_file: .env
    environment:
      <<: *application-database-environment
      UPLOAD_ROOT: /data/uploads
      SECRET_KEY_PATH: /data/secrets/settings.key
      IMPORT_ROOTS: /data/import
    command: >
      sh -c "alembic upgrade head &&
      village-insight-bootstrap &&
      uvicorn village_insight.api.app:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      secret-init:
        condition: service_completed_successfully
    group_add:
      - "${VI_HOST_GID:-1000}"
    networks:
      - village-insight
    volumes:
      - upload_data:/data/uploads
      - ./data/server-transfer/current:/data/server-transfer:ro
      - ./data/secrets:/data/secrets
      - ./data/import:/data/import:ro
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${EXPOSE_API_PORT:-8000}:8000"
    restart: unless-stopped

  worker-parse:
    profiles: ["application"]
    build:
      context: .
    env_file: .env
    environment:
      <<: *application-database-environment
      UPLOAD_ROOT: /data/uploads
      SECRET_KEY_PATH: /data/secrets/settings.key
      IMPORT_ROOTS: /data/import
    command: >
      sh -c 'village-insight-worker --lane parse
      --concurrency "$${PARSE_WORKERS:-2}"'
    depends_on:
      api:
        condition: service_started
    group_add:
      - "${VI_HOST_GID:-1000}"
    networks:
      - village-insight
    volumes:
      - upload_data:/data/uploads
      - ./data/server-transfer/current:/data/server-transfer:ro
      - ./data/secrets:/data/secrets:ro
      - ./data/import:/data/import:ro
    restart: unless-stopped

  worker-hermes:
    profiles: ["application"]
    build:
      context: .
    env_file: .env
    environment:
      <<: *application-database-environment
      UPLOAD_ROOT: /data/uploads
      SECRET_KEY_PATH: /data/secrets/settings.key
      IMPORT_ROOTS: /data/import
    command: >
      sh -c 'village-insight-worker --lane hermes
      --concurrency "$${HERMES_WORKERS:-1}"'
    depends_on:
      api:
        condition: service_started
    group_add:
      - "${VI_HOST_GID:-1000}"
    networks:
      - village-insight
    volumes:
      - upload_data:/data/uploads
      - ./data/server-transfer/current:/data/server-transfer:ro
      - ./data/secrets:/data/secrets:ro
      - ./data/import:/data/import:ro
    restart: unless-stopped

  worker-materialize:
    profiles: ["application"]
    build:
      context: .
    env_file: .env
    environment:
      <<: *application-database-environment
      UPLOAD_ROOT: /data/uploads
      SECRET_KEY_PATH: /data/secrets/settings.key
      IMPORT_ROOTS: /data/import
    command: >
      sh -c 'village-insight-worker --lane materialize
      --concurrency "$${MATERIALIZE_WORKERS:-1}"'
    depends_on:
      api:
        condition: service_started
    group_add:
      - "${VI_HOST_GID:-1000}"
    networks:
      - village-insight
    volumes:
      - upload_data:/data/uploads
      - ./data/server-transfer/current:/data/server-transfer:ro
      - ./data/secrets:/data/secrets:ro
      - ./data/import:/data/import:ro
    restart: unless-stopped

  web:
    profiles: ["application"]
    build:
      context: ./frontend
    depends_on:
      - api
    networks:
      - village-insight
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${EXPOSE_WEB_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  upload_data:
    name: village_insight_upload_data
